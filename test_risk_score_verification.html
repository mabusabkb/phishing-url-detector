<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Score & Verdict Verification Tests</title>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 900px; margin: 0 auto; }
    .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .test-section h2 { margin-top: 0; font-size: 18px; }
    .test-case { margin: 10px 0; padding: 8px; background: #f5f5f5; border-radius: 4px; }
    .pass { color: #1D9E75; font-weight: 500; }
    .fail { color: #A32D2D; font-weight: 500; }
    .info { color: #666; font-size: 14px; }
    .summary { background: #e8f4f8; padding: 15px; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>Risk Score & Verdict Classification Verification</h1>
  <p class="info">Testing Requirements 3.1, 3.3, 3.4, 3.5, 3.6 from phishing-detection-dashboard spec</p>

  <div id="results"></div>

  <script>
    // Extract demo data from the implementation
    const DEMOS = {
      safe: {
        url: 'https://github.com/anthropics/anthropic-sdk',
        result: { verdict: 'safe', score: 8 }
      },
      suspicious: {
        url: 'http://paypa1-verify.net/account/confirm',
        result: { verdict: 'suspicious', score: 67 }
      },
      phishing: {
        url: 'http://secure-bank-login.xyz/wellsfargo/signin/verify',
        result: { verdict: 'phishing', score: 96 }
      }
    };

    const history = [
      {url:'https://github.com/openai/gpt-4',verdict:'safe',score:6},
      {url:'http://paypa1-verify.net/account/confirm',verdict:'suspicious',score:67},
      {url:'http://secure-bank-login.xyz/wellsfargo/signin/verify',verdict:'phishing',score:96},
      {url:'https://stackoverflow.com/questions/12345',verdict:'safe',score:11},
      {url:'http://amazon-primerenew.click/account',verdict:'phishing',score:91},
      {url:'https://docs.anthropic.com/claude',verdict:'safe',score:4}
    ];

    // Simulate the classification logic from the implementation
    function classifyUrl(url) {
      for(const k of ['safe','suspicious','phishing']) {
        if(DEMOS[k].url === url) { 
          return { type: k, result: DEMOS[k].result };
        }
      }
      const lc = url.toLowerCase();
      if(lc.includes('phish')||lc.includes('xyz')||lc.includes('click')||lc.includes('login')||lc.includes('verify')||lc.includes('secure-')) {
        return { type: 'phishing', result: DEMOS.phishing.result };
      }
      if(lc.includes('paypa')||lc.includes('amaz')||lc.includes('bank')||lc.includes('account')) {
        return { type: 'suspicious', result: DEMOS.suspicious.result };
      }
      return { type: 'safe', result: DEMOS.safe.result };
    }

    // Test functions
    const tests = {
      req_3_1_score_bounds: () => {
        const results = [];
        const allScores = [
          ...Object.values(DEMOS).map(d => d.result.score),
          ...history.map(h => h.score)
        ];
        
        let allPass = true;
        for (const score of allScores) {
          const isInteger = Number.isInteger(score);
          const inRange = score >= 0 && score <= 100;
          const pass = isInteger && inRange;
          
          if (!pass) {
            allPass = false;
            results.push(`Score ${score}: ${!isInteger ? 'NOT INTEGER' : 'OUT OF RANGE'}`);
          }
        }
        
        if (allPass) {
          results.push(`All ${allScores.length} scores are integers between 0-100`);
        }
        
        return { pass: allPass, details: results };
      },

      req_3_3_safe_threshold: () => {
        const results = [];
        const safeEntries = history.filter(h => h.verdict === 'safe');
        const safeScores = [...safeEntries.map(h => h.score), DEMOS.safe.result.score];
        
        let allPass = true;
        for (const score of safeScores) {
          const inRange = score >= 0 && score <= 39;
          if (!inRange) {
            allPass = false;
            results.push(`Safe verdict with score ${score} is OUTSIDE 0-39 range`);
          }
        }
        
        if (allPass) {
          results.push(`All safe verdicts (${safeScores.length}) have scores 0-39: [${safeScores.join(', ')}]`);
        }
        
        return { pass: allPass, details: results };
      },

      req_3_4_suspicious_threshold: () => {
        const results = [];
        const suspEntries = history.filter(h => h.verdict === 'suspicious');
        const suspScores = [...suspEntries.map(h => h.score), DEMOS.suspicious.result.score];
        
        let allPass = true;
        for (const score of suspScores) {
          const inRange = score >= 40 && score <= 69;
          if (!inRange) {
            allPass = false;
            results.push(`Suspicious verdict with score ${score} is OUTSIDE 40-69 range`);
          }
        }
        
        if (allPass) {
          results.push(`All suspicious verdicts (${suspScores.length}) have scores 40-69: [${suspScores.join(', ')}]`);
        }
        
        return { pass: allPass, details: results };
      },

      req_3_5_phishing_threshold: () => {
        const results = [];
        const phishEntries = history.filter(h => h.verdict === 'phishing');
        const phishScores = [...phishEntries.map(h => h.score), DEMOS.phishing.result.score];
        
        let allPass = true;
        for (const score of phishScores) {
          const inRange = score >= 70 && score <= 100;
          if (!inRange) {
            allPass = false;
            results.push(`Phishing verdict with score ${score} is OUTSIDE 70-100 range`);
          }
        }
        
        if (allPass) {
          results.push(`All phishing verdicts (${phishScores.length}) have scores 70-100: [${phishScores.join(', ')}]`);
        }
        
        return { pass: allPass, details: results };
      },

      req_3_6_deterministic_scoring: () => {
        const results = [];
        const testUrls = [
          'https://github.com/anthropics/anthropic-sdk',
          'http://paypa1-verify.net/account/confirm',
          'http://secure-bank-login.xyz/wellsfargo/signin/verify',
          'https://test-phishing-site.xyz',
          'http://paypal-login.com',
          'https://example.com'
        ];
        
        let allPass = true;
        for (const url of testUrls) {
          const result1 = classifyUrl(url);
          const result2 = classifyUrl(url);
          const result3 = classifyUrl(url);
          
          const consistent = (
            result1.type === result2.type && 
            result2.type === result3.type &&
            result1.result.score === result2.result.score &&
            result2.result.score === result3.result.score
          );
          
          if (!consistent) {
            allPass = false;
            results.push(`URL "${url}" produced INCONSISTENT results`);
          } else {
            results.push(`URL "${url}" → ${result1.type} (score: ${result1.result.score}) - CONSISTENT`);
          }
        }
        
        return { pass: allPass, details: results };
      }
    };

    // Run all tests
    function runTests() {
      const resultsDiv = document.getElementById('results');
      let html = '';
      let totalPass = 0;
      let totalTests = 0;

      const testDescriptions = {
        req_3_1_score_bounds: 'Requirement 3.1: Risk scores are integers between 0-100',
        req_3_3_safe_threshold: 'Requirement 3.3: Safe verdict = scores 0-39',
        req_3_4_suspicious_threshold: 'Requirement 3.4: Suspicious verdict = scores 40-69',
        req_3_5_phishing_threshold: 'Requirement 3.5: Phishing verdict = scores 70-100',
        req_3_6_deterministic_scoring: 'Requirement 3.6: Deterministic scoring for identical URLs'
      };

      for (const [testName, testFn] of Object.entries(tests)) {
        totalTests++;
        const result = testFn();
        if (result.pass) totalPass++;

        html += `
          <div class="test-section">
            <h2>${testDescriptions[testName]}</h2>
            <div class="test-case">
              <strong class="${result.pass ? 'pass' : 'fail'}">
                ${result.pass ? '✓ PASS' : '✗ FAIL'}
              </strong>
            </div>
            ${result.details.map(d => `<div class="info">• ${d}</div>`).join('')}
          </div>
        `;
      }

      html = `
        <div class="summary">
          <h2>Test Summary</h2>
          <p><strong>${totalPass} of ${totalTests} requirements verified</strong></p>
          <p class="${totalPass === totalTests ? 'pass' : 'fail'}">
            ${totalPass === totalTests ? '✓ All requirements PASS' : '⚠ Some requirements FAIL'}
          </p>
        </div>
      ` + html;

      resultsDiv.innerHTML = html;
    }

    // Run tests on load
    runTests();
  </script>
</body>
</html>
